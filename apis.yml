name: PCH International
description: 'PCH International (pchintl.com) is a global supply chain solutions provider that
  helps brands bring innovative physical products to market across the entire product lifecycle.
  Its services span new product introduction (NPI) planning, design and development, validation
  and manufacturing (EVT/DVT/PVT), and post-production revenue optimization, plus global
  logistics, direct-to-consumer (D2C) transformation, supply-chain financing, and sustainability
  programs. PCH serves personal care and beauty, health and fitness, home and lifestyle,
  accessories, audio and entertainment, and smart retail sectors. Surfaced as a portfolio company
  of Norwest Venture Partners, PCH is a B2B services provider with no public developer API or
  platform at this time.'
